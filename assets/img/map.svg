<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="Stylised map of central Newton Abbot showing Newton Old Market on Market Street">
  <!-- Schematic, not to scale. Ground -->
  <rect width="800" height="620" fill="#f1e7da"/>

  <!-- Blocks -->
  <g fill="#e9dcc9">
    <rect x="60" y="60" width="200" height="150" rx="3"/>
    <rect x="310" y="40" width="220" height="120" rx="3"/>
    <rect x="80" y="270" width="150" height="140" rx="3"/>
    <rect x="300" y="250" width="140" height="110" rx="3"/>
    <rect x="500" y="210" width="160" height="130" rx="3"/>
    <rect x="120" y="470" width="220" height="110" rx="3"/>
    <rect x="420" y="440" width="180" height="130" rx="3"/>
  </g>

  <!-- Streets: casing then fill -->
  <g fill="none" stroke="#d9c9b0" stroke-linecap="round">
    <path d="M-20 230 C 180 225, 420 215, 700 190" stroke-width="30"/>
    <path d="M270 -20 C 268 140, 262 360, 250 640" stroke-width="30"/>
    <path d="M-20 430 C 200 420, 460 400, 820 380" stroke-width="26"/>
    <path d="M470 170 C 480 280, 490 420, 500 640" stroke-width="22"/>
  </g>
  <g fill="none" stroke="#faf5ee" stroke-linecap="round">
    <path d="M-20 230 C 180 225, 420 215, 700 190" stroke-width="22"/>
    <path d="M270 -20 C 268 140, 262 360, 250 640" stroke-width="22"/>
    <path d="M-20 430 C 200 420, 460 400, 820 380" stroke-width="18"/>
    <path d="M470 170 C 480 280, 490 420, 500 640" stroke-width="14"/>
  </g>

  <!-- Railway, top right, with station -->
  <path d="M560 640 C 610 480, 680 300, 810 150" fill="none" stroke="#211a13" stroke-width="4" stroke-dasharray="14 9" opacity="0.55"/>
  <g>
    <rect x="640" y="380" width="18" height="18" fill="#211a13" opacity="0.8" transform="rotate(28 649 389)"/>
    <text x="628" y="384" text-anchor="end" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#7a6e60">NEWTON ABBOT</text>
    <text x="628" y="404" text-anchor="end" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#7a6e60">STATION</text>
  </g>

  <!-- Street name -->
  <text x="196" y="330" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#7a6e60" transform="rotate(88 196 330)">MARKET STREET</text>

  <!-- The NOM: terracotta pin -->
  <g>
    <circle cx="322" cy="300" r="46" fill="#ac4b1d" opacity="0.14"/>
    <circle cx="322" cy="300" r="26" fill="#ac4b1d"/>
    <!-- window mark, knocked out -->
    <g transform="translate(309.5 285) scale(0.078)" fill="none" stroke="#faf5ee">
      <path stroke-width="26" d="M22 366 V160 A138 138 0 0 1 298 160 V366 Z"/>
      <circle stroke-width="22" cx="160" cy="100" r="48"/>
      <path stroke-width="22" d="M120 366 V216 A40 40 0 0 1 200 216 V366"/>
    </g>
    <text x="366" y="295" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="19" font-weight="700" letter-spacing="2.5" fill="#211a13">NEWTON OLD MARKET</text>
    <text x="366" y="317" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#7a6e60">MARKET STREET &#183; TQ12 2RB</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(748 60)">
    <path d="M0 14 L7 -14 L14 14 L7 7 Z" fill="#211a13" opacity="0.65"/>
    <text x="7" y="34" text-anchor="middle" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="13" font-weight="600" fill="#7a6e60">N</text>
  </g>

  <!-- Note -->
  <text x="24" y="596" font-family="'Century Gothic', 'Avenir Next', sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#a4988a">SCHEMATIC &#183; NOT TO SCALE</text>
</svg>
